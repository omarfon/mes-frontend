<div class="w-screen h-screen flex bg-slate-950 text-slate-100 items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600/20 border border-blue-500/30 rounded-2xl mb-4">
        <span class="pi pi-key text-2xl text-blue-400"></span>
      </div>
      <h2 class="text-2xl font-semibold text-white">Nueva contraseña</h2>
      <p class="mt-1 text-sm text-slate-400">Ingresa el token y tu nueva contraseña</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl shadow-xl p-8 backdrop-blur-sm">

      <!-- Éxito -->
      <div *ngIf="success" class="space-y-4 text-center">
        <div class="flex items-center justify-center gap-2 text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 rounded-lg px-3 py-4 text-sm">
          <span class="pi pi-check-circle text-xl"></span>
          <span>¡Contraseña actualizada! Redirigiendo al login...</span>
        </div>
        <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full bg-emerald-500 animate-[width_3s_linear]" style="width: 100%; transition: width 3s linear;"></div>
        </div>
      </div>

      <!-- Formulario -->
      <form *ngIf="!success" (ngSubmit)="submit()" class="space-y-5">

        <!-- Token -->
        <div class="space-y-1">
          <label class="text-xs font-medium text-slate-300">Token de recuperación</label>
          <div class="relative">
            <span class="pi pi-ticket absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></span>
            <input
              type="text"
              [(ngModel)]="token"
              name="token"
              required
              class="w-full bg-slate-900/80 border border-slate-700/60 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono"
              placeholder="Pega aquí el token recibido"
            />
          </div>
        </div>

        <!-- Nueva contraseña -->
        <div class="space-y-1">
          <label class="text-xs font-medium text-slate-300">Nueva contraseña</label>
          <div class="relative">
            <span class="pi pi-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
              minlength="6"
              class="w-full bg-slate-900/80 border border-slate-700/60 rounded-lg pl-9 pr-9 py-2 text-sm text-slate-100
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Mínimo 6 caracteres"
            />
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">
              <span [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></span>
            </button>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="space-y-1">
          <label class="text-xs font-medium text-slate-300">Confirmar contraseña</label>
          <div class="relative">
            <span class="pi pi-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              class="w-full bg-slate-900/80 border border-slate-700/60 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Repite tu nueva contraseña"
            />
          </div>
          <!-- Indicador de coincidencia -->
          <p *ngIf="confirmPassword && newPassword !== confirmPassword"
             class="text-[10px] text-red-400 flex items-center gap-1">
            <span class="pi pi-times-circle"></span> Las contraseñas no coinciden
          </p>
          <p *ngIf="confirmPassword && newPassword === confirmPassword && confirmPassword.length >= 6"
             class="text-[10px] text-emerald-400 flex items-center gap-1">
            <span class="pi pi-check-circle"></span> Las contraseñas coinciden
          </p>
        </div>

        <!-- Error -->
        <div *ngIf="error" class="flex items-center gap-2 text-red-400 bg-red-950/40 border border-red-800/40 rounded-lg px-3 py-2 text-xs">
          <span class="pi pi-exclamation-circle"></span>
          {{ error }}
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed
                 text-white font-medium py-2.5 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
          <span *ngIf="loading" class="pi pi-spin pi-spinner text-xs"></span>
          {{ loading ? 'Actualizando...' : 'Cambiar contraseña' }}
        </button>

      </form>

    </div>

    <!-- Links -->
    <p class="mt-6 text-center text-xs text-slate-500">
      <a routerLink="/auth/forgot-password" class="text-blue-400 hover:text-blue-300">Solicitar nuevo token</a>
      <span class="mx-2">·</span>
      <a routerLink="/auth/login" class="text-blue-400 hover:text-blue-300">Volver al login</a>
    </p>

  </div>
</div>
